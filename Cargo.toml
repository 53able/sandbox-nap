[package]
name = "sandbox-nap"
version = "0.1.0"
edition = "2021"
description = "Idle-tiering daemon and CLI for Apple Container sandboxes (hot / stopped / archived)"
license = "Apache-2.0"
publish = false

[[bin]]
name = "sandbox-nap"
path = "src/main.rs"

[[test]]
name = "e2e"
path = "tests/e2e.rs"
required-features = ["e2e"]

[features]
# 実機の Apple Container に対する e2e テストを有効にする。
e2e = []

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
